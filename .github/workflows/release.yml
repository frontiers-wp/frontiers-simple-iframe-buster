name: Generate Clean WordPress Plugin Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Package Plugin without branch suffixes
        run: |
          # Create a pristine directory matching your target WordPress slug
          mkdir -p frontiers-simple-iframe-buster
          
          # Copy your plugin files into the folder while avoiding hidden git parameters
          rsync -rc --exclude='.git*' --exclude='.github' ./ frontiers-simple-iframe-buster/
          
          # Compress the directory structure directly from the cleanly named folder root
          zip -r frontiers-simple-iframe-buster.zip frontiers-simple-iframe-buster

      - name: Upload Pristine Zip to GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: frontiers-simple-iframe-buster.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
